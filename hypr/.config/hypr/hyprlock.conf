general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

background {
    monitor = DP-1
    path = /home/lolleo/Pictures/Wallpapers/pexels-nathanmarcam-10558778.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

# 時間
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.95)
    font_size = 96
    font_family = Noto Sans CJK TC
    position = 0, 160
    halign = center
    valign = center
}

# 日期
label {
    monitor =
    text = cmd[update:60000] date +"%-m 月 %-d 日 %A"
    color = rgba(255, 255, 255, 0.7)
    font_size = 20
    font_family = Noto Sans CJK TC
    position = 0, 80
    halign = center
    valign = center
}

# 密碼輸入框
input-field {
    monitor =
    size = 280, 52
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(20, 20, 24, 0.55)
    font_color = rgb(240, 240, 240)
    check_color = rgba(255, 255, 255, 0.5)
    fail_color = rgba(255, 90, 90, 0.8)
    fade_on_empty = false
    rounding = 26
    placeholder_text = <span foreground="##ffffff99">輸入密碼</span>
    fail_text = <span foreground="##ff5a5a">$FAIL</span>
    position = 0, -40
    halign = center
    valign = center
}
